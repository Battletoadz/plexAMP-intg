[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidal-bridge"
version = "0.1.0"
description = "Tidal API bridge for PlexAmp integration - fetches collections, playlists, metadata, and streams using your own Tidal developer credentials"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "plexamp-universal-intg" },
]

dependencies = [
    "requests>=2.31.0,<3",
    "requests-cache>=1.2.0,<2",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "fastapi>=0.111.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "python-dotenv>=1.0.0,<2",
    "httpx>=0.27.0,<1",
    "cryptography>=43.0.0,<44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "ruff>=0.5.0,<1",
    "mypy>=1.10.0,<2",
    "types-requests>=2.31.0,<3",
]

[project.scripts]
tidal-bridge = "tidal_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tidal_bridge", "core", "server"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["tidal_bridge", "core", "server"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
